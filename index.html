<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F0E8" />
<title>习惯打卡</title>
<style>

/* ============ tokens ============ */
:root{
  --bg:#F5EFE7;
  --paper:#EFE6DA;
  --card:#FFFDF9;
  --ink:#26202E;
  --ink-2:#57505E;
  --muted:#7B7060;
  --faint:#B9AE9F;
  --line:#EAE0D3;
  --line-2:#DCCFBF;
  --accent:#6B5BD0;
  --accent-2:#5545B6;
  --accent-soft:#EFEBFA;
  --accent-glow:rgba(107,91,208,.16);
  --danger:#D4615C;
  --danger-soft:#FCEFEB;
  --busy:#9A6A2F;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:12px;
  --ease:cubic-bezier(.22,1,.36,1);
  --shadow-card:0 1px 2px rgba(70,50,30,.04),0 22px 46px -30px rgba(92,62,42,.34);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding:26px 16px 68px;
  background:
    radial-gradient(900px 540px at 88% -8%, rgba(159,141,225,.20), transparent 62%),
    radial-gradient(780px 460px at -12% 26%, rgba(224,170,122,.15), transparent 55%),
    radial-gradient(1100px 760px at 50% 118%, rgba(205,182,158,.14), transparent 60%),
    linear-gradient(180deg,#F7F1E9 0%,#F1E8DC 100%);
  background-attachment:fixed;
}
::selection{background:var(--accent-soft);color:var(--accent-2);}
.app{max-width:560px;margin:0 auto;}

/* top line: wordmark + gear */
.topline{display:flex;align-items:center;justify-content:space-between;margin:0 4px 18px;}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;letter-spacing:.01em;margin:0;color:var(--ink);}
.brand .dot{width:11px;height:11px;border-radius:4px;background:linear-gradient(135deg,#9183E6,#5646B9);box-shadow:0 1px 3px rgba(86,70,185,.4);display:inline-block;}
.gear{
  width:40px;height:40px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.72);
  font-size:16px;line-height:1;color:#6E6358;cursor:pointer;
  box-shadow:0 6px 16px -10px rgba(90,60,40,.5);
  transition:transform .18s var(--ease),border-color .18s,background .18s,color .18s;
}
.gear:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft);transform:rotate(14deg);}

/* cards */
.card{
  background:var(--card);
  border:1px solid rgba(130,100,70,.10);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-card);
  padding:20px;
  margin-bottom:14px;
  animation:rise .5s var(--ease) both;
}
.card h2{
  margin:0;font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--muted);
}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* today hero */
#topCard{
  position:relative;overflow:hidden;padding:22px 20px 18px;
  background:linear-gradient(150deg,#FFFEFC 0%,#FBF8FE 58%,#F3EDFA 100%);
  border-color:rgba(107,91,208,.12);
}
#topCard::after{
  content:'';position:absolute;right:-46px;top:-56px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(159,141,225,.28), rgba(159,141,225,0) 68%);pointer-events:none;
}
.hrow{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.hdate{font-size:22px;font-weight:650;letter-spacing:.01em;line-height:1.2;}
.hsub{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.5;}
.hsub.celebrate{color:var(--accent-2);font-weight:600;}
.hbig{
  font-size:42px;font-weight:650;line-height:1;color:var(--accent-2);
  font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
  text-align:right;margin-top:2px;
}
.hbig .big-total{color:var(--faint);font-size:21px;font-weight:600;}
.bar{position:relative;height:9px;border-radius:99px;background:rgba(120,95,60,.10);margin-top:18px;overflow:hidden;}
.bar i{
  display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#9C8FE8,var(--accent) 70%,var(--accent-2));
  box-shadow:0 0 0 1px rgba(107,91,208,.12),0 0 16px rgba(107,91,208,.28);
  transition:width .5s var(--ease);
}

/* week stats */
.week-card{background:linear-gradient(180deg,#FFFDF9,#FCF9F6);}
.week-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.week-range{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.02em;}
.wg{margin-top:15px;}
.wg-line{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px;}
.wg-line b{color:var(--accent-2);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.01em;}
.pbar{height:8px;border-radius:99px;background:rgba(120,95,60,.12);overflow:hidden;}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#9C8FE8,var(--accent));transition:width .5s var(--ease);}
.week-days{margin-top:18px;}
.week-bars{display:flex;gap:4px;}
.wb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;}
.wbtop{height:15px;line-height:15px;}
.wbtick{color:var(--accent-2);font-weight:800;font-size:12px;}
.wbbar{height:50px;width:100%;display:flex;align-items:flex-end;justify-content:center;}
.wbbar i{display:block;width:8px;border-radius:5px;background:rgba(120,95,60,.14);transition:height .35s var(--ease),background .2s;}
.wb.has .wbbar i{background:linear-gradient(180deg,#9C8FE8,var(--accent));}
.wb.full .wbbar i,.wb.today .wbbar i{background:linear-gradient(180deg,#7A6AD8,var(--accent-2));}
.wbl{font-size:11px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums;}
.wb.today .wbl{color:var(--accent-2);font-weight:800;}
.wb.future{opacity:.42;}

/* habit list */
#habitList{list-style:none;margin:0;padding:2px 0 0;display:flex;flex-direction:column;}
.habit{
  display:flex;align-items:center;gap:13px;
  padding:15px 2px;
  border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
  transition:background .16s,opacity .2s;
}
#habitList .habit:last-child{border-bottom:none;}
.habit .hemoji{font-size:26px;line-height:1;transition:filter .2s,opacity .2s,transform .2s;}
.habit .hname{flex:1;min-width:0;font-size:16px;font-weight:520;letter-spacing:.01em;overflow-wrap:anywhere;transition:color .2s;}
.habit .hcheck{
  flex:none;width:25px;height:25px;border-radius:50%;
  border:1.6px solid #CFC4CE;position:relative;
  background:transparent;
  transition:background .18s,border-color .18s,transform .14s var(--ease),box-shadow .18s;
}
.habit:active .hcheck{transform:scale(.88);}
.hcheck::after{
  content:'';position:absolute;left:50%;top:50%;width:11px;height:6px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:translate(-50%,-62%) rotate(-45deg);opacity:0;transition:opacity .12s;
}
.hdel{
  flex:none;border:none;background:none;color:#C5B8AB;font-size:12px;line-height:1;
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s,background .15s;
}
.habit:hover .hdel,.hdel:focus-visible{opacity:1;}
@media (hover:none){.hdel{opacity:.55;}}
.hdel:hover{color:var(--danger);background:var(--danger-soft);}
.habit:hover .hemoji{transform:scale(1.06);}

/* completed */
.habit.done{background:transparent;}
.habit.done .hemoji{filter:grayscale(1);opacity:.38;}
.habit.done .hname{color:#ACA29C;text-decoration:line-through;text-decoration-color:#C9BFB6;}
.habit.done .hcheck{background:var(--accent);border-color:var(--accent);box-shadow:0 2px 8px -2px rgba(107,91,208,.6);}
.habit.done .hcheck::after{opacity:1;}

/* delete confirm */
.habit.confirm{
  cursor:default;background:var(--danger-soft);
  border:1px solid #EFC9C1;border-bottom:1px solid #EFC9C1;
  border-radius:var(--r-md);padding:12px 14px;margin:10px 0;
  flex-wrap:wrap;gap:10px;
}
.cf-text{flex:1;min-width:150px;font-size:14px;color:#9A5148;}
.cf-actions{display:flex;gap:8px;}
.mini{border:none;border-radius:11px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;}
.mini:active{transform:scale(.97);}
.mini.gray{background:#EEE7DE;color:#6E6358;}
.mini.gray:hover{background:#E4DAD0;}
.mini.danger{background:var(--danger);color:#fff;}
.mini.danger:hover{background:#C14F4A;}

/* empty */
.empty{text-align:center;padding:30px 8px 14px;color:var(--muted);}
.empty .eicon{font-size:46px;line-height:1;filter:drop-shadow(0 6px 10px rgba(150,110,70,.16));}
.empty p{margin:14px 0 18px;font-size:15px;color:var(--muted);}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.chips button{
  border:1px solid #E3D9F3;background:#F3EDF9;border-radius:99px;
  padding:10px 17px;font-size:14px;cursor:pointer;color:var(--ink-2);
  font-family:inherit;transition:all .16s var(--ease);
}
.chips button:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft);transform:translateY(-1px);}

/* add form */
.addform{display:flex;gap:9px;margin-top:8px;padding-top:18px;border-top:1px solid var(--line);}
.inp{
  border:1px solid transparent;border-radius:14px;padding:12px 14px;
  font-size:15px;font-family:inherit;outline:none;
  background:#F6F1E9;color:var(--ink);
  transition:background .16s,border-color .16s,box-shadow .16s;
}
.inp:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.inp::placeholder{color:#B9AD9E;}
.name-inp{flex:1;min-width:0;}
.emoji-inp{width:64px;text-align:center;}
.addbtn{
  border:none;border-radius:14px;padding:0 19px;
  background:linear-gradient(180deg,#7A6AD8,#5646B9);
  color:#fff;font-size:15px;font-weight:650;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 18px -8px rgba(86,70,185,.65),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .12s var(--ease),box-shadow .2s;
}
.addbtn:hover{box-shadow:0 10px 22px -8px rgba(86,70,185,.75),inset 0 1px 0 rgba(255,255,255,.22);}
.addbtn:active{transform:scale(.97);}
.btn2{
  border:1px solid var(--line-2);background:#fff;border-radius:14px;
  padding:0 17px;height:46px;font-size:14px;font-weight:600;color:var(--ink-2);
  cursor:pointer;font-family:inherit;transition:all .16s;
}
.btn2:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft);}
.err{color:var(--danger);font-size:13px;margin-top:10px;}

/* history calendar */
.hist{background:linear-gradient(180deg,#FFFDF9,#FCFAF6);}
.hist h2{margin-bottom:2px;}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;}
.navbtn{
  width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:11px;
  font-size:18px;color:var(--ink-2);cursor:pointer;line-height:1;padding:0;
  transition:all .16s;
}
.navbtn:hover:not(:disabled){border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft);}
.navbtn:disabled{opacity:.3;cursor:default;}
.caltitle{font-size:16px;font-weight:650;letter-spacing:.02em;}
.calwd,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);}
.calwd span{text-align:center;font-size:11px;color:var(--faint);padding:5px 0;font-weight:600;letter-spacing:.05em;}
.calgrid{gap:3px;margin-top:4px;}
.ccell{
  min-height:48px;border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.ccell .dnum{font-size:13.5px;color:var(--ink-2);font-weight:550;line-height:1;}
.ccell .dstat{font-size:10.5px;color:#A99D90;line-height:1;font-variant-numeric:tabular-nums;}
.ccell .dstat.zero{color:#CEC3B4;}
.ccell.full{background:var(--accent-soft);}
.ccell.full .dnum{color:var(--accent-2);font-weight:700;}
.ccell.full .dstat{color:var(--accent);font-weight:700;}
.ccell.today{box-shadow:inset 0 0 0 1.5px var(--accent);}
.ccell.future{opacity:.32;}
.calnote{margin-top:13px;font-size:12px;color:#B4A899;text-align:center;letter-spacing:.02em;}

/* sync settings */
.synchead{display:flex;align-items:center;justify-content:space-between;}
.syncbadge{font-size:12px;font-weight:700;color:var(--accent-2);background:var(--accent-soft);padding:4px 11px;border-radius:99px;}
.syncbadge.off{color:#8A7E72;background:#EEE6DD;}
.syncbadge.err{color:var(--danger);background:var(--danger-soft);}
.synctip{font-size:12.5px;color:var(--muted);line-height:1.75;margin:12px 0 2px;}
#syncCard label{display:block;font-size:12px;color:var(--muted);margin-top:12px;}
#syncCard .inp{width:100%;margin-top:5px;}
.syncactions{display:flex;gap:10px;margin-top:16px;}
.syncactions .addbtn{height:46px;}
.synckey{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7;}
.synckey.ok{color:var(--accent-2);}
.synckey.err{color:var(--danger);}
.syncclear{display:inline-block;border:none;background:none;color:#9A8E80;font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:12px;padding:0;transition:color .15s;}
.syncclear:hover{color:var(--danger);}

/* footer sync status */
.foot{
  margin:20px 4px 0;display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:12px;color:#9A8E80;cursor:pointer;user-select:none;letter-spacing:.03em;
  transition:color .15s;
}
.foot:hover{color:var(--ink-2);}
.foot .st.ok{color:var(--accent-2);}
.foot .st.err{color:var(--danger);}
.foot .st.busy{color:var(--busy);}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}

</style>
</head>
<body>
<main class="app">
  <div class="topline">
    <h1 class="brand"><span class="dot" aria-hidden="true"></span>习惯打卡</h1>
    <button class="gear" id="gearBtn" type="button" aria-label="多端同步设置" title="多端同步设置">⚙️</button>
  </div>

  <section class="card" id="topCard">
    <div class="hrow">
      <div>
        <div class="hdate" id="dateLabel"></div>
        <div class="hsub" id="subLabel"></div>
      </div>
      <div class="hbig" id="bigProgress"></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <section class="card week-card">
    <div class="week-head">
      <h2>本周统计</h2>
      <span class="week-range" id="weekRange"></span>
    </div>
    <div class="wg">
      <div class="wg-line"><span>坚持天数</span><b id="wgStickT"></b></div>
      <div class="pbar"><i id="wgStickB"></i></div>
    </div>
    <div class="wg">
      <div class="wg-line"><span>打卡完成</span><b id="wgDoneT"></b></div>
      <div class="pbar"><i id="wgDoneB"></i></div>
    </div>
    <div class="week-days">
      <div class="week-bars" id="weekDays"></div>
    </div>
  </section>

  <section class="card" id="syncCard" hidden>
    <div class="synchead">
      <h2>多端同步设置</h2>
      <span class="syncbadge off" id="syncBadge">未开启</span>
    </div>
    <p class="synctip">把打卡数据存到你 GitHub 的一个私有仓库，手机和电脑就能看到同一份记录。同步用的 Token 只保存在“当前这台设备的浏览器”里，不会上传到本页面以外的地方。</p>
    <label>GitHub 用户名
      <input class="inp" id="sOwner" placeholder="例如 octocat" autocomplete="off" spellcheck="false" />
    </label>
    <label>数据仓库名（私有）
      <input class="inp" id="sRepo" placeholder="例如 habit-data" autocomplete="off" spellcheck="false" />
    </label>
    <label>访问令牌（Token，需 Contents 读写权限）
      <input class="inp" id="sToken" type="password" placeholder="github_pat_… 或 ghp_…" autocomplete="off" spellcheck="false" />
    </label>
    <div class="syncactions">
      <button class="addbtn" id="sSave" type="button">保存并同步</button>
      <button class="btn2" id="sTest" type="button">测试连接</button>
    </div>
    <div class="synckey" id="sHint"></div>
    <button class="syncclear" id="sClear" type="button">清除同步设置（回到仅本机保存）</button>
  </section>

  <section class="card">
    <ul id="habitList"></ul>
    <div class="empty" id="emptyBox" hidden>
      <div class="eicon">🌱</div>
      <p>还没有习惯，先添加几个想坚持的吧</p>
      <div class="chips" id="chips">
        <button type="button" data-name="喝水" data-emoji="💧">💧 喝水</button>
        <button type="button" data-name="运动" data-emoji="🏃">🏃 运动</button>
        <button type="button" data-name="读书" data-emoji="📖">📖 读书</button>
      </div>
    </div>
    <form class="addform" id="addForm" autocomplete="off">
      <input class="inp name-inp" id="nameInput" placeholder="习惯名称，如：喝水" maxlength="20" />
      <input class="inp emoji-inp" id="emojiInput" placeholder="emoji" maxlength="8" />
      <button class="addbtn" type="submit">添加</button>
    </form>
    <div class="err" id="errBox" hidden></div>
  </section>

  <section class="card hist" id="histCard" hidden>
    <h2>历史记录</h2>
    <div class="calnav">
      <button class="navbtn" id="prevBtn" type="button" aria-label="上个月">‹</button>
      <span class="caltitle" id="calTitle"></span>
      <button class="navbtn" id="nextBtn" type="button" aria-label="下个月">›</button>
    </div>
    <div class="calwd"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="calgrid" id="calGrid"></div>
    <div class="calnote">格子里显示「完成 / 应有」</div>
  </section>

  <div class="foot" id="footBtn" role="button" title="多端同步设置">
    <span class="st" id="syncText">仅本机保存</span><span>⚙</span>
  </div>
</main>
<script>
(function(){
  'use strict';
  var LS_HABITS='habits.v1';
  var LS_RECORDS='records.v1';
  var LS_SYNC='sync.v1';

  function load(key,fb){
    try{
      var raw=localStorage.getItem(key);
      if(raw===null||raw===undefined) return fb;
      return JSON.parse(raw);
    }catch(e){ return fb; }
  }
  function save(key,val){
    try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){}
  }

  var habits=load(LS_HABITS,[]);
  var records=load(LS_RECORDS,{});
  if(!Array.isArray(habits)) habits=[];
  habits=habits.filter(function(h){ return h&&typeof h.id==='string'&&typeof h.name==='string'&&h.name.trim().length>0; });

  function pad(n){ return (n<10?'0':'')+n; }
  function dateKeyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function todayKey(){ return dateKeyOf(new Date()); }
  function uid(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function sanitizeAll(){
    if(!records||typeof records!=='object'||Array.isArray(records)) records={};
    var ids={}; habits.forEach(function(h){ ids[h.id]=1; });
    Object.keys(records).forEach(function(k){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(records[k])){ delete records[k]; return; }
      records[k]=records[k].filter(function(id){ return !!ids[id]; });
      if(records[k].length===0) delete records[k];
    });
    var tk=todayKey();
    habits.forEach(function(h){
      if(typeof h.emoji!=='string'||!h.emoji) h.emoji='⭐';
      if(typeof h.createdAt!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(h.createdAt)||h.createdAt>tk) h.createdAt=tk;
    });
  }
  sanitizeAll();

  function $(id){ return document.getElementById(id); }
  var dateLabel=$('dateLabel'), subLabel=$('subLabel'), bigProgress=$('bigProgress'), barFill=$('barFill');
  var habitList=$('habitList'), emptyBox=$('emptyBox'), chips=$('chips');
  var addForm=$('addForm'), nameInput=$('nameInput'), emojiInput=$('emojiInput'), errBox=$('errBox');
  var histCard=$('histCard'), prevBtn=$('prevBtn'), nextBtn=$('nextBtn'), calTitle=$('calTitle'), calGrid=$('calGrid');
  var weekDays=$('weekDays'), weekRange=$('weekRange'), wgStickT=$('wgStickT'), wgStickB=$('wgStickB'), wgDoneT=$('wgDoneT'), wgDoneB=$('wgDoneB');
  var gearBtn=$('gearBtn'), syncCard=$('syncCard'), syncBadge=$('syncBadge');
  var sOwner=$('sOwner'), sRepo=$('sRepo'), sToken=$('sToken'), sSave=$('sSave'), sTest=$('sTest'), sClear=$('sClear'), sHint=$('sHint');
  var footBtn=$('footBtn'), syncText=$('syncText');

  /* ---------- 多端同步 (GitHub 私有仓库) ---------- */
  var sync=load(LS_SYNC,null);
  if(!sync||typeof sync!=='object'||Array.isArray(sync)) sync={owner:'',repo:'',token:'',branch:'main',updatedAt:null,dirty:false,sha:null};
  var syncStatus=''; // '', 'busy', 'ok', 'err'
  var syncLastOk=null;
  var syncPushTimer=null;
  var syncTickTimer=null;

  function syncConfigured(){ return !!(sync.owner&&sync.repo&&sync.token); }
  function saveSync(){ save(LS_SYNC,sync); }
  function syncAuthHeaders(){ return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+sync.token,'X-GitHub-Api-Version':'2022-11-28'}; }
  function syncApi(path,opts){
    return fetch('https://api.github.com'+path,opts);
  }
  function b64utf8(s){ return btoa(unescape(encodeURIComponent(s))); }
  function utf8b64(s){ return decodeURIComponent(escape(atob(s))); }
  function localHasData(){ return habits.length>0||Object.keys(records).length>0; }
  function pad2(n){ return (n<10?'0':'')+n; }

  function setSyncBusy(){ syncStatus='busy'; updateSyncUI(); }
  function setSyncOk(){ syncStatus='ok'; syncLastOk=new Date(); updateSyncUI(); }
  function setSyncErr(){ syncStatus='err'; updateSyncUI(); }

  function updateSyncUI(){
    var text,cls;
    if(!syncConfigured()){ text='仅本机保存 · 点此开启多端同步'; cls=''; }
    else if(sync.dirty){ text='等待同步…'; cls='busy'; }
    else if(syncStatus==='err'){ text='同步失败，稍后自动重试'; cls='err'; }
    else if(syncStatus==='ok'&&syncLastOk){ text='已同步 '+pad2(syncLastOk.getHours())+':'+pad2(syncLastOk.getMinutes()); cls='ok'; }
    else { text='正在同步…'; cls='busy'; }
    syncText.textContent=text;
    syncText.className='st'+(cls?(' '+cls):'');
    if(!syncConfigured()){ syncBadge.textContent='未开启'; syncBadge.className='syncbadge off'; }
    else if(syncStatus==='err'){ syncBadge.textContent='连接异常'; syncBadge.className='syncbadge err'; }
    else { syncBadge.textContent='已开启'; syncBadge.className='syncbadge'; }
  }

  async function fetchRemote(){
    var path='/repos/'+encodeURIComponent(sync.owner)+'/'+encodeURIComponent(sync.repo)+'/contents/habits.json?ref='+encodeURIComponent(sync.branch);
    var r=await syncApi(path,{headers:syncAuthHeaders()});
    if(r.status===404) return {status:404,file:null};
    if(!r.ok){
      var em={};
      try{ em=await r.json(); }catch(e){}
      var why=r.status===401?'认证失败（Token 无效）':r.status===403?'权限不足或触发限流':('HTTP '+r.status);
      throw new Error(why+((em&&em.message)?('：'+em.message):''));
    }
    var j=await r.json();
    var obj;
    try{ obj=JSON.parse(utf8b64(j.content)); }catch(e){ throw new Error('远端数据无法解析'); }
    return {status:200,file:{sha:j.sha,obj:obj}};
  }

  function syncPayload(){
    return {habits:habits,records:records,updatedAt:sync.updatedAt||new Date().toISOString()};
  }

  async function pushRemote(){
    var base='/repos/'+encodeURIComponent(sync.owner)+'/'+encodeURIComponent(sync.repo)+'/contents/habits.json';
    var attempt=0;
    while(attempt<2){
      attempt++;
      var body={message:'habit sync '+new Date().toISOString(),content:b64utf8(JSON.stringify(syncPayload()))};
      var getR=await syncApi(base+'?ref='+encodeURIComponent(sync.branch),{headers:syncAuthHeaders()});
      if(getR.ok){
        var gj=await getR.json();
        sync.sha=gj.sha;
        body.sha=gj.sha;
      }else if(getR.status!==404){
        var ge={}; try{ ge=await getR.json(); }catch(e){}
        throw new Error('读取远端失败 HTTP '+getR.status+((ge&&ge.message)?('：'+ge.message):''));
      }
      var putR=await syncApi(base,{method:'PUT',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+sync.token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify(body)});
      if(putR.status===200||putR.status===201){
        try{ var pj=await putR.json(); if(pj&&pj.content&&pj.content.sha) sync.sha=pj.content.sha; }catch(e){}
        sync.dirty=false;
        saveSync();
        setSyncOk();
        return;
      }
      if(putR.status===409){
        var cf;
        try{ cf=await fetchRemote(); }catch(e){ cf={status:0,file:null}; }
        if(cf.status===200&&cf.file&&cf.file.obj&&cf.file.obj.updatedAt&&cf.file.obj.updatedAt>sync.updatedAt){
          adoptRemote(cf.file.obj);
          return;
        }
        continue;
      }
      var pe={}; try{ pe=await putR.json(); }catch(e){}
      throw new Error('写入失败 HTTP '+putR.status+((pe&&pe.message)?('：'+pe.message):''));
    }
    throw new Error('同步冲突，请稍后重试');
  }

  function doPush(){
    if(!syncConfigured()) return;
    sync.dirty=true;
    saveSync();
    setSyncBusy();
    pushRemote().catch(function(){ setSyncErr(); });
  }

  function adoptRemote(obj){
    habits=(obj&&Array.isArray(obj.habits))?obj.habits:[];
    records=(obj&&obj.records&&typeof obj.records==='object'&&!Array.isArray(obj.records))?obj.records:{};
    habits=habits.filter(function(h){ return h&&typeof h.id==='string'&&typeof h.name==='string'&&h.name.trim().length>0; });
    sanitizeAll();
    sync.updatedAt=(obj&&obj.updatedAt)||new Date().toISOString();
    sync.dirty=false;
    save(LS_HABITS,habits);
    save(LS_RECORDS,records);
    saveSync();
    setSyncOk();
    render();
  }

  function remoteEmpty(obj){
    if(obj&&Array.isArray(obj.habits)&&obj.habits.length>0) return false;
    if(obj&&obj.records&&typeof obj.records==='object'&&!Array.isArray(obj.records)&&Object.keys(obj.records).length>0) return false;
    return true;
  }
  function mergeRemote(obj){
    var map={}; var merged=[];
    (obj&&Array.isArray(obj.habits)?obj.habits:[]).forEach(function(h){ if(h&&h.id&&!map[h.id]){ map[h.id]=1; merged.push(h); } });
    habits.forEach(function(h){ if(h&&h.id&&!map[h.id]){ map[h.id]=1; merged.push(h); } });
    habits=merged;
    var rec=(obj&&obj.records&&typeof obj.records==='object'&&!Array.isArray(obj.records))?obj.records:{};
    Object.keys(rec).forEach(function(k){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      var arr=rec[k];
      if(!Array.isArray(arr)) return;
      if(!records[k]) records[k]=[];
      arr.forEach(function(id){ if(records[k].indexOf(id)<0) records[k].push(id); });
    });
    sanitizeAll();
    var now=new Date().toISOString();
    var rts=(obj&&obj.updatedAt)||'';
    sync.updatedAt=(rts&&rts>now)?rts:now;
    sync.dirty=true;
    save(LS_HABITS,habits);
    save(LS_RECORDS,records);
    saveSync();
    render();
    doPush();
  }

  async function syncTick(){
    if(!syncConfigured()){ updateSyncUI(); return; }
    var res;
    try{ res=await fetchRemote(); }
    catch(e){ setSyncErr(); return; }
    if(res.status===200){
      var obj=res.file.obj;
      var rts=(obj&&obj.updatedAt)||'';
      var lts=sync.updatedAt||'';
      if(!lts){
        var locData=localHasData();
        var remEmpty=remoteEmpty(obj);
        if(locData&&remEmpty){ sync.updatedAt=new Date().toISOString(); sync.dirty=true; saveSync(); doPush(); return; }
        if(locData&&!remEmpty){ mergeRemote(obj); return; }
        adoptRemote(obj);
        return;
      }
      if(sync.dirty&&(!rts||lts>=rts)){ sync.sha=res.file.sha; saveSync(); doPush(); return; }
      if(rts>lts){ adoptRemote(obj); return; }
      sync.sha=res.file.sha;
      saveSync();
      setSyncOk();
      return;
    }
    if(res.status===404){
      if(sync.dirty||localHasData()){ doPush(); return; }
      setSyncOk();
      return;
    }
    setSyncErr();
  }

  function syncInit(){
    if(!syncConfigured()){ updateSyncUI(); return; }
    setSyncBusy();
    syncTick();
  }

  function markDirty(){
    var t=new Date().toISOString();
    if(!sync.updatedAt||t>sync.updatedAt) sync.updatedAt=t;
    sync.dirty=true;
    saveSync();
    if(syncPushTimer) clearTimeout(syncPushTimer);
    syncPushTimer=setTimeout(function(){ syncPushTimer=null; doPush(); },600);
    updateSyncUI();
  }

  function resetSyncConfig(){
    sync={owner:'',repo:'',token:'',branch:'main',updatedAt:null,dirty:false,sha:null};
    syncStatus=''; syncLastOk=null;
    saveSync();
    sOwner.value=''; sRepo.value=''; sToken.value='';
    sHint.textContent=''; sHint.className='synckey';
    updateSyncUI();
  }

  /* ---------- 主渲染 ---------- */
  var pendingDelete=null;
  var viewYear,viewMonth;

  function habitsOn(key){ return habits.filter(function(h){ return h.createdAt<=key; }); }
  function doneCountOn(key){
    var arr=records[key];
    if(!arr||arr.length===0) return 0;
    var set={}; arr.forEach(function(id){ set[id]=1; });
    var n=0;
    habits.forEach(function(h){ if(h.createdAt<=key&&set[h.id]) n++; });
    return n;
  }

  function render(){
    var key=todayKey();
    var total=habits.length;
    var doneSet={};
    (records[key]||[]).forEach(function(id){ doneSet[id]=1; });
    var done=0; habits.forEach(function(h){ if(doneSet[h.id]) done++; });

    var now=new Date();
    dateLabel.textContent=now.getMonth()+1+'月'+now.getDate()+'日 · 星期'+'日一二三四五六'.charAt(now.getDay());
    bigProgress.innerHTML=done+'<span class="big-total"> / '+total+'</span>';
    barFill.style.width=(total>0?Math.round(done/total*100):0)+'%';

    var msg;
    if(total===0){ msg='添加几个想坚持的习惯，开始打卡吧'; subLabel.className='hsub'; }
    else if(done===0){ msg='今天一个都还没完成，加油 💪'; subLabel.className='hsub'; }
    else if(done===total){ msg='今天全部完成，太棒了 🎉'; subLabel.className='hsub celebrate'; }
    else { msg='已完成 '+done+' 项，还差 '+(total-done)+' 项，坚持！'; subLabel.className='hsub'; }
    subLabel.textContent=msg;

    if(total===0){
      habitList.innerHTML='';
      emptyBox.hidden=false;
    }else{
      emptyBox.hidden=true;
      var html='';
      habits.forEach(function(h){
        var id=h.id, isDone=!!doneSet[id];
        if(pendingDelete===id){
          html+='<li class="habit confirm" data-id="'+id+'">'
            +'<span class="cf-text">删除「'+esc(h.name)+'」并清理它的打卡记录？</span>'
            +'<span class="cf-actions">'
            +'<button type="button" class="mini danger" data-action="delOk">删除</button>'
            +'<button type="button" class="mini gray" data-action="delNo">取消</button>'
            +'</span></li>';
        }else{
          html+='<li class="habit'+(isDone?' done':'')+'" data-id="'+id+'">'
            +'<span class="hemoji">'+esc(h.emoji)+'</span>'
            +'<span class="hname">'+esc(h.name)+'</span>'
            +'<span class="hcheck" data-action="toggle" role="button" aria-label="'+(isDone?'取消打卡':'完成打卡')+'"></span>'
            +'<button type="button" class="hdel" data-action="del" aria-label="删除习惯">✕</button>'
            +'</li>';
        }
      });
      habitList.innerHTML=html;
    }
    histCard.hidden=(total===0);
    renderWeek();
    renderCalendar(key);    renderCalendar(key);
    updateSyncUI();
  }

  function renderWeek(){
    var now=new Date();
    var wd=(now.getDay()+6)%7;
    var mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-wd);
    var sun=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+6);
    var tKey=todayKey();
    var i, elapsed=wd+1, stick=0, totalChecks=0, maxPossible=0, rows=[];
    for(i=0;i<7;i++){
      var dt=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i);
      var k=dateKeyOf(dt);
      var y=habitsOn(k).length;
      var x=doneCountOn(k);
      var future=(k>tKey);
      if(!future){ maxPossible+=y; totalChecks+=x; if(x>0) stick++; }
      rows.push({x:x,y:y,future:future,today:(k===tKey),full:(!future&&y>0&&x===y)});
    }
    weekRange.textContent=(mon.getMonth()+1)+'月'+mon.getDate()+'日 – '+(sun.getMonth()+1)+'月'+sun.getDate()+'日';
    var hasHabits=habits.length>0;
    wgStickT.textContent=hasHabits?('已坚持 '+stick+' / '+elapsed+' 天'):'—';
    wgDoneT.textContent=hasHabits?('完成 '+totalChecks+' / '+maxPossible+' 次'):'—';
    wgStickB.style.width=(hasHabits&&elapsed>0?Math.round(stick/elapsed*100):0)+'%';
    wgDoneB.style.width=(hasHabits&&maxPossible>0?Math.round(totalChecks/maxPossible*100):0)+'%';
    var html='', labels='一二三四五六日';
    for(i=0;i<7;i++){
      var r=rows[i];
      var cls='wb';
      if(r.today) cls+=' today';
      if(r.future) cls+=' future';
      if(!r.future&&r.y>0&&r.x>0) cls+=' has';
      if(r.full) cls+=' full';
      var h=4;
      if(!r.future&&r.y>0) h=r.x>0?Math.max(12,Math.round(r.x/r.y*48)):4;
      html+='<div class="'+cls+'" title="'+labels.charAt(i)+' 完成 '+(r.y>0?r.x+' / '+r.y:'—')+'">'
        +'<div class="wbtop">'+(r.full?'<span class="wbtick">✓</span>':'')+'</div>'
        +'<div class="wbbar"><i style="height:'+h+'px"></i></div>'
        +'<div class="wbl">'+labels.charAt(i)+'</div>'
        +'</div>';
    }
    weekDays.innerHTML=html;
  }

  function renderCalendar(todayK){
    var t=todayK||todayKey();
    var now=new Date();
    calTitle.textContent=viewYear+'年'+(viewMonth+1)+'月';
    nextBtn.disabled=(viewYear===now.getFullYear()&&viewMonth===now.getMonth());
    var first=new Date(viewYear,viewMonth,1);
    var lead=(first.getDay()+6)%7;
    var dim=new Date(viewYear,viewMonth+1,0).getDate();
    var html='',i;
    for(i=0;i<lead;i++) html+='<span class="ccell blank"></span>';
    for(i=1;i<=dim;i++){
      var dt=new Date(viewYear,viewMonth,i);
      var k=dateKeyOf(dt);
      var y=habitsOn(k).length;
      var x=doneCountOn(k);
      var isToday=(k===t);
      var isFuture=(k>t);
      var full=(y>0&&x===y);
      var cls='ccell';
      if(isToday) cls+=' today';
      if(isFuture) cls+=' future';
      if(full&&!isFuture) cls+=' full';
      var stat='';
      if(!isFuture&&y>0){
        if(x>0) stat='<span class="dstat">'+x+'/'+y+'</span>';
        else stat='<span class="dstat zero">0/'+y+'</span>';
      }
      html+='<span class="'+cls+'"><span class="dnum">'+i+'</span>'+stat+'</span>';
    }
    calGrid.innerHTML=html;
  }

  function toggleHabit(id){
    var k=todayKey();
    var arr=(records[k]||[]).slice();
    var idx=arr.indexOf(id);
    if(idx>=0) arr.splice(idx,1); else arr.push(id);
    if(arr.length) records[k]=arr; else delete records[k];
    save(LS_RECORDS,records);
    markDirty();
    render();
  }
  function deleteHabit(id){
    habits=habits.filter(function(h){ return h.id!==id; });
    Object.keys(records).forEach(function(k){
      records[k]=records[k].filter(function(x){ return x!==id; });
      if(records[k].length===0) delete records[k];
    });
    pendingDelete=null;
    save(LS_HABITS,habits);
    save(LS_RECORDS,records);
    markDirty();
    render();
  }
  function addHabit(name,emoji){
    habits.push({ id:uid(), name:name, emoji:emoji||'⭐', createdAt:todayKey() });
    save(LS_HABITS,habits);
    markDirty();
    render();
  }

  habitList.addEventListener('click',function(e){
    var li=e.target&&e.target.closest?e.target.closest('li.habit'):null;
    if(!li) return;
    var id=li.getAttribute('data-id');
    var actEl=e.target.closest('[data-action]');
    if(actEl){
      var a=actEl.getAttribute('data-action');
      if(a==='del'){ pendingDelete=(pendingDelete===id?null:id); render(); return; }
      if(a==='delOk'){ deleteHabit(id); return; }
      if(a==='delNo'){ pendingDelete=null; render(); return; }
    }
    if(pendingDelete===id) return;
    toggleHabit(id);
  });

  chips.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('button[data-name]'):null;
    if(!b) return;
    addHabit(b.getAttribute('data-name'),b.getAttribute('data-emoji')||'⭐');
  });

  var errTimer=null;
  function showErr(m){
    errBox.textContent=m; errBox.hidden=false;
    if(errTimer) clearTimeout(errTimer);
    errTimer=setTimeout(function(){ errBox.hidden=true; },2200);
  }
  addForm.addEventListener('submit',function(e){
    e.preventDefault();
    var name=nameInput.value.trim();
    if(!name){ showErr('请输入习惯名称'); nameInput.focus(); return; }
    if(Array.from(name).length>20){ showErr('习惯名称最多 20 个字'); return; }
    var em=Array.from(emojiInput.value.trim()).slice(0,4).join('');
    addHabit(name,em||'⭐');
    nameInput.value=''; emojiInput.value=''; nameInput.focus();
  });

  prevBtn.addEventListener('click',function(){
    viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; } render();
  });
  nextBtn.addEventListener('click',function(){
    var now=new Date();
    if(viewYear>now.getFullYear()||(viewYear===now.getFullYear()&&viewMonth>=now.getMonth())) return;
    viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; } render();
  });

  /* ---------- 设置面板 ---------- */
  function openSyncPanel(){
    syncCard.hidden=!syncCard.hidden;
    if(!syncCard.hidden){
      sOwner.value=sync.owner||'';
      sRepo.value=sync.repo||'';
      sToken.value=sync.token||'';
      sHint.textContent='';
      sHint.className='synckey';
    }
  }
  gearBtn.addEventListener('click',openSyncPanel);
  footBtn.addEventListener('click',openSyncPanel);

  function showHint(m,cls){
    sHint.textContent=m;
    sHint.className='synckey'+(cls?(' '+cls):'');
  }

  sSave.addEventListener('click',function(){
    var owner=sOwner.value.trim();
    var repo=sRepo.value.trim();
    var token=sToken.value.trim();
    if(!owner||!repo||!token){ showHint('请填写 GitHub 用户名、仓库名和 Token 三项。','err'); return; }
    if(!/^[A-Za-z0-9-]+$/.test(owner)){ showHint('用户名格式不正确。','err'); return; }
    if(!/^[A-Za-z0-9_.-]+$/.test(repo)){ showHint('仓库名格式不正确。','err'); return; }
    sync.owner=owner; sync.repo=repo; sync.token=token; sync.branch='main';
    saveSync();
    showHint('正在连接并同步…','');
    syncInit();
  });

  sTest.addEventListener('click',async function(){
    if(!syncConfigured()){ showHint('请先填写并保存设置。','err'); return; }
    showHint('正在测试连接…','');
    setSyncBusy();
    try{
      var r=await syncApi('/repos/'+encodeURIComponent(sync.owner)+'/'+encodeURIComponent(sync.repo),{headers:syncAuthHeaders()});
      if(r.ok){ setSyncOk(); showHint('连接成功 ✓ 用户名与仓库有效。','ok'); }
      else if(r.status===401){ setSyncErr(); showHint('Token 无效或已过期。','err'); }
      else if(r.status===403){ setSyncErr(); showHint('Token 权限不足（需要 Contents 读写）。','err'); }
      else if(r.status===404){ setSyncErr(); showHint('仓库不存在，请检查用户名与仓库名。','err'); }
      else { setSyncErr(); showHint('连接异常：HTTP '+r.status,'err'); }
    }catch(e){ setSyncErr(); showHint('网络错误，无法连接 GitHub：'+e.message,'err'); }
  });

  sClear.addEventListener('click',function(){
    resetSyncConfig();
    showHint('已清除，回到仅本机保存。','');
  });

  /* ---------- 日期切换 & 定时同步 ---------- */
  function resetCal(){ var n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth(); }

  var currentDayKey=todayKey();
  function onDayTick(){
    var k=todayKey();
    if(k!==currentDayKey){
      currentDayKey=k;
      var n=new Date();
      if(viewYear!==n.getFullYear()||viewMonth!==n.getMonth()) resetCal();
      pendingDelete=null;
      render();
    }
    if(syncTickTimer) clearTimeout(syncTickTimer);
    syncTickTimer=setTimeout(function(){ syncTickTimer=null; syncTick(); },1500);
  }
  setInterval(onDayTick,60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) onDayTick(); });
  window.addEventListener('focus',onDayTick);

  resetCal();
  render();
  syncInit();
})();
</script>
</body>
